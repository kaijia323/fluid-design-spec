  failure_handling:
    - scenario: "网络原因 clone 失败"
      handling: "README 给出排查方向：换 SSH 地址 git@github.com:kaijia323/fluid-design-spec.git；仓库为公开仓库，与权限无关。"
    - scenario: "判断不出项目根目录（规范目录上一级不是 git 仓库、也没有 AGENTS.md/CLAUDE.md，当前目录也不在规范目录之上）"
      handling: "install.mjs 退出码 1，打印两条出路：在项目根目录执行，或用 --root <项目根>；只想删 .git 可加 --no-agents。不会挑默认值往上层写。"
    - scenario: "安装目录里没有 .git（重复安装或已手工删除）"
      handling: "install.mjs 打印「.git 已不存在，跳过」并继续后续步骤，退出码仍为 0。"
    - scenario: "删除 .git 失败（权限不足）"
      handling: "install.mjs 打印失败原因与「rm -rf fluid-design-spec/.git」的手动命令，退出码 1。此时约束块已写好（顺序：先写块、后删 .git），不会留下半成品。"
    - scenario: "写 AGENTS.md 失败（只读文件、目标是目录等）"
      handling: "打印失败原因并提示可用 --no-agents 跳过，由人工把约束写进去，退出码 1；此时 .git 尚未删除，重跑即可。"
    - scenario: "AGENTS.md 是符号链接"
      handling: "跳过写入并说明原因（避免写到项目外面），其余步骤照常，退出码 0；要写就换真实文件或 --agents-md 指定。"
    - scenario: "AGENTS.md 不是 UTF-8（GBK 等）"
      handling: "按字节追加，原有字节一个不改；打印提示建议把该文件另存为 UTF-8。"
    - scenario: "索引里 fluid-design-spec/ 已经是子模块指针（mode 160000）"
      handling: "打印可直接复制的恢复命令 git rm -r -f --cached <路径> + git add <路径>（少了 -f 会被 git 拒绝），有 .gitmodules 时再补一条去掉登记的命令。"
    - scenario: "项目 .gitignore 忽略了 fluid-design-spec/"
      handling: "install.mjs 打印警告：git add 收不到规范文件，需先在 .gitignore 放行（不自动改用户的 .gitignore）。"
    - scenario: "用户只想看规范、不打算提交进项目"
      handling: "加 --keep-git 保留 .git，并明确警告项目 git 只会记录 160000 子模块指针。"
