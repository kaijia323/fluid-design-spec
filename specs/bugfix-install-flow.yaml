spec:
  type: bugfix
  name: "修正安装流程：公开仓库 + 装到项目根目录 fluid-design-spec/ + 删 .git 让规范进用户项目 git + 写 AGENTS.md"
  id: bugfix-install-flow
  version: 5
  updated: "2026-09-25"
  status: done
  blocked_reason: ""
  status_log:
    - date: "2026-09-25"
      from: ready
      to: in_progress
      by: lead
      version: 2
      note: "安装契约已冻结：装到 <项目根>/fluid-design-spec/、删 .git、把带标记的约束块写进 AGENTS.md；开始实现 install.mjs 并重写 README 第二节"
    - date: "2026-09-25"
      from: in_progress
      to: done
      by: lead
      version: 3
      note: "install.mjs + README 第二节完成；8 组实测（正常/已有 AGENTS.md/只有 CLAUDE.md/dry-run/keep-git/gitignore/非规范目录/参数错误）全过，门禁无回归"
    - date: "2026-09-25"
      from: done
      to: in_progress
      by: lead
      version: 4
      note: "独立复核反馈 5 项（非 UTF-8 的 AGENTS.md 被写坏 / 项目根判断不出来时写错位置 / submodule 与 gitlink 恢复命令不可用 / 符号链接写到项目外 / --agents-md 越界），逐条加固为 install.mjs v1.1 并重建回归套件（16 组 52 项断言）"
    - date: "2026-09-25"
      from: in_progress
      to: done
      by: lead
      version: 5
      note: "5 项复核发现全部修复：agent 文件改按字节追加（GBK 零损坏）、项目根判不出来即拒绝执行、符号链接与越界路径拒绝写入、索引 160000 时打印含 -f 的恢复命令、先写块后删 .git；README 三/四/八/十节命令补 fluid-design-spec/ 前缀"
  related:
    - "仓库 https://github.com/kaijia323/fluid-design-spec —— 已由私有改为公开（用户 2026-09-25 告知，gh repo view 实测 visibility=PUBLIC）"
    - "被修正的对象：提交 9f18efa「docs: README 新增安装章节（复制一句话给 AI 助手）+ 章节顺延重排」"
    - "独立复核（subagent ac7d3736，2026-09-25）：AC1~AC7 全 pass；提出 3 个静默问题（非 UTF-8 的 AGENTS.md 被写坏 / 规范目录不在项目根时写错位置 / submodule 形式提示与事实不符）+ 2 个低危问题（符号链接写到项目外、--agents-md 无路径约束），已全部修复并复测"
  severity: medium
  symptom: |
    用户照着 README 第二节安装，装出来的结果和期望不符，四处对不上：
    (1) README 说「本仓库当前是私有（private）」，让助手跑 gh auth status 查权限、说给别人用要先加 Collaborator；
        仓库其实已经公开，这段话把人往权限问题上带，也让自助安装的人以为自己没权限。
    (2) 安装位置写死 docs/fluid-design-spec/，用户要的是装到项目根目录。
    (3) 装完没有人删掉 clone 下来的 .git：项目里 git add 时整个规范目录被记成一个子模块指针
        （mode 160000），规范文件一个都没进用户自己的仓库 —— 用户原话「安装成功后应该删除 .git 让当前的规范进入用户的项目 git 去」。
    (4) 安装命令写的是 gh repo clone（要先装 gh 并登录），用户要求用更通用的 git clone。
  context: |
    规范本体是 Markdown + CSS 令牌 + 一个零依赖 Node 门禁脚本，没有构建步骤。
    「安装」实质只有三件事：把仓库文件放进用户项目、去掉仓库自带的 .git、留一条「写界面前先读规范」的约束给 AI 助手。
    旧 README 只写了前一半（clone），后两步靠读者自觉，于是第 (3) 条几乎必然发生。
    本次把三步固定成一条命令 scripts/install.mjs，README 第二节按新流程重写。
    安装位置、agent 文件选择这两件事已当面向用户确认（见 assumptions）。
    独立复核后又加固了一轮：安装脚本的每一处写操作都必须「要么做对，要么明确报错」，不允许静默损坏用户既有内容。
  assumptions:
    - "安装位置 = 项目根目录下的一个文件夹 <项目根>/fluid-design-spec/（用户 2026-09-25 拍板，二选一里选了「根目录下建一个文件夹」）。整个仓库内容原样带过去；规范自己的 README.md 就在这个文件夹里，不会覆盖用户项目根目录的 README.md（用户原话：有啥冲突吗，规范的 readme 是在 fluidxxx 文件夹下面的啊）。"
    - "约束块写进项目根目录的 AGENTS.md；没有 AGENTS.md 就新建，只有 CLAUDE.md 就写进 CLAUDE.md（用户 2026-09-25 拍板）。"
    - "clone 下来的 .git 直接删除，不保留成 submodule（用户明确要求）。代价：以后不能 git pull 升级，README 给了「备份 brand.css → 重新 clone → 再跑 install.mjs」的更新流程。"
    - "零依赖：install.mjs 只用 node 内置模块（fs / path / process / child_process / url），Node >= 18，与 scripts/brand.mjs 口径一致。"
    - "只碰两处写入：项目根下的 AGENTS.md / CLAUDE.md（只追加或新建）、删 <规范目录>/.git。不动用户任何既有文件内容。"
    - "宁可报错也不猜：判断不出项目根目录、目标路径越界、目标是符号链接或目录时，脚本停下来让人用 --root / --agents-md 明确指定，而不是挑一个默认值写下去。"
  blocking_questions: []
  open_questions:
    - q: "这次改动要不要提交并推送到 GitHub main？"
      status: answered
      asked_at: "2026-09-25"
      answer: "用户原话：「提交并推送」。理由：不推的话别人 clone 到的还是没有 install.mjs 的旧版，README 主路径在远端跑不通（复核实测：远端 main 的 scripts/ 里只有 brand.mjs）。"
  environment:
    version: "仓库 v2.0，main @ 9f18efa"
    os: "Ubuntu Linux；git 2.43.0；Node v24.21.0"
    runtime: "node >= 18（install.mjs / brand.mjs 均零依赖）"
    account: "GitHub kaijia323，仓库 visibility=PUBLIC（不需要 token 即可匿名 clone）"
    config: "安装目标 = <项目根>/fluid-design-spec/；约束块目标 = <项目根>/AGENTS.md"
  reproduction:
    steps:
      - "按 9f18efa 版 README 第二节第 54 行执行：gh repo clone kaijia323/fluid-design-spec docs/fluid-design-spec（未登录 gh 的环境直接失败）"
      - "即使换成 git clone 成功：保持 docs/fluid-design-spec/.git 不动"
      - "在项目根目录 git add -A && git ls-files -s docs/fluid-design-spec | awk '{print $1}' | sort -u"
    expected: "规范文件作为普通文件进用户自己的仓库（mode 100644，逐个文件可见）；位置在项目根目录下，不需要 gh 登录"
    actual: "只有一行 mode 160000（子模块指针），规范文件 0 个进仓库；位置在 docs/ 下；README 还说是私有仓库"
    frequency: always
  evidence:
    - type: file
      detail: "旧 README 第 62 行：「本仓库当前是私有（private）……先让助手跑一次 gh auth status 看有没有权限」；第 43 / 48 / 54 / 55 / 58 行把安装位置写死为 docs/fluid-design-spec/；全文没有删除 .git 的步骤"
      location: "README.md @ 9f18efa"
    - type: log
      detail: 'gh repo view kaijia323/fluid-design-spec --json visibility → visibility=PUBLIC，defaultBranchRef.name=main'
      location: "本机终端"
    - type: log
      detail: "实测保留 .git 时：git ls-files -s fluid-design-spec 的 mode 列 → 160000（规范文件 0 个进仓库）；删掉 .git 后同一命令 → 全部 100644"
      location: "/tmp/fds-a、/tmp/fds-e 临时项目"
    - type: file
      detail: "install.mjs 的常驻回归套件 /tmp/t/run.sh：16 组场景、52 项断言，最终 52 PASS / 0 FAIL；覆盖标准流程、幂等、末尾无换行的 AGENTS.md、GBK 的 AGENTS.md、只有 CLAUDE.md、三个开关、.gitignore、老位置 docs/、判断不出项目根、从子目录跑、submodule 形式、已被 add 成 gitlink、符号链接、--agents-md 越界、错误路径、门禁回归"
      location: "/tmp/t/run.sh（复核后重跑）"
    - type: log
      detail: "git rm -r --cached 对 gitlink 会以「staged content different from both the file and the HEAD」拒绝；必须 git rm -r -f --cached，实测恢复后 17 个文件全部 100644"
      location: "/tmp/rec-a、/tmp/rec-b"
  scope:
    affected:
      - "README.md 第二节（安装）整体重写；第一节目录说明补 install.mjs 与安装位置；第三节、第四节、第八节、第十节的 brand.mjs 命令补 fluid-design-spec/ 前缀"
      - "scripts/install.mjs（新增）"
    not_affected:
      - "tokens/ 全部文件、Design.md、DESIGN.mobile.md、DESIGN.web.md、fluid-design.skill.md、SOURCES.md 内容不动"
      - "scripts/brand.mjs 的门禁逻辑与阈值不动（只跑回归）"
      - "用户项目里的任何既有文件内容不动（agent 文件按字节追加）"
  root_cause:
    hypothesis: |
      安装章节是在「仓库还是私有 + 安装位置按 docs/ 设想」的前提下写的，仓库转公开、用户改口径（装到项目根目录、
      删 .git 让文件进自己的仓库）之后，这段说明与真实期望脱节；更关键的是缺一步不可跳过的动作（删 .git），
      且没有任何可执行物把「删 .git + 写 AGENTS.md」固定下来，全靠读者自觉。
    evidence: |
      README @ 9f18efa：第 62 行仍写私有；第 43 / 54 行命令写死 docs/fluid-design-spec 且用 gh repo clone；
      全文 grep 不到 rm -rf .git；实测保留 .git 时项目 git 只记录 160000。
    confirmed: true
  fix:
    approach: |
      1. 新增 scripts/install.mjs（零依赖、Node >= 18）：把带标记的规范约束块写进项目 AGENTS.md
         （没有则新建；只有 CLAUDE.md 则写进 CLAUDE.md；重复跑靠标记幂等）→ 删掉 <规范目录>/.git →
         打印下一步与两端读取组合；另带 --root / --agents-md / --no-agents / --keep-git / --dry-run / --help。
      2. README 第二节重写为：git clone（公开仓库、不用 gh repo clone）→ node fluid-design-spec/scripts/install.mjs
         → brand.mjs check；「核对三件事」写清位置、无 .git（不是 160000）、AGENTS.md 有约束块；
         另补「更新到最新规范」流程（备份 brand.css → 重新 clone → install.mjs --no-agents）。
      3. README 删除「本仓库当前是私有」整段，改为公开仓库说明 + 克隆失败排查（网络 / SSH）；
         第三节 / 第四节 / 第八节 / 第十节的 brand.mjs 命令统一补 fluid-design-spec/ 前缀
         （否则在项目根目录跑会找不到脚本，或误跑用户项目自己的 scripts/brand.mjs），并在第一节目录树后说明这条写法约定。
      4. 复核后加固（v1.1，针对独立复核的 5 项发现）：
         · agent 文件按字节读、按字节追加 —— 非 UTF-8（GBK 等）旧文件零损坏，并提示改存 UTF-8；
         · 项目根判断不出来时拒绝执行（不再默认往规范目录上一级写），可用 --root 明确指定；
         · agent 文件是符号链接 / 目标是目录 / --agents-md 指到项目根外 → 拒绝写入；
         · .git 是文件（submodule / worktree 形式）单独提示；索引里已经是 160000 时打印带 -f 的恢复命令
           （git rm -r -f --cached + git add，并提示清理 .gitmodules 登记）；
         · 顺序调整为先写约束块、后删 .git，写入失败不会留下「.git 已删但约束没写」的半成品。
    files:
      - "scripts/install.mjs（新增，约 310 行）"
      - "README.md（第一节目录说明与写法约定、第二节安装、公开仓库说明、三/四/八/十节命令前缀）"
    constraints:
      - "零依赖：只用 node 内置模块，不引入 npm 包"
      - "不依赖 gh CLI，用通用 git clone"
      - "绝不覆盖或重编码用户项目既有文件：agent 文件按字节追加"
      - "不放松 scripts/brand.mjs 的任何门禁阈值"
      - "宁可报错也不往不确定的位置写（判断不出项目根、路径越界、符号链接一律拒绝）"
    alternatives_considered:
      - "用 git submodule 代替删 .git —— 否决：用户要的是规范文件进自己的仓库，submodule 仍然只是一个指针"
      - "用 curl 下 tarball（本来就不含 .git）—— 否决：用户指定用通用的 git clone；且 clone 后删 .git 对用户是可见可核对的动作"
      - "把删 .git 交给 AI 助手按提示词人工执行 —— 否决：不可验收，漏了就退回原状（正是本次缺陷）"
      - "把规范装到项目根目录直接铺开（不建文件夹）—— 否决：会和用户项目自己的 Design.md / scripts/ 撞名（用户也选了建文件夹）"
      - "非 UTF-8 的 AGENTS.md 直接拒绝写入（复核建议的另一方案）—— 未采用：按字节追加可以做到零损坏，比整个跳过更有用；改为追加 + 明确提示"
      - "自动改写 .gitmodules / 自动 git rm --cached —— 否决：动用户的 git 登记属于高风险副作用，改为打印可直接复制的命令"
  regression_tests:
    - "常驻套件：bash /tmp/t/run.sh —— 16 组场景 52 项断言，最终 52 PASS / 0 FAIL（命令见 verification.commands）"
    - "标准流程：临时项目 git init + 自有 README.md/src → 模拟 clone 出 fluid-design-spec/（含 .git）→ install.mjs → 退出码 0、.git 消失、AGENTS.md 生成、项目文件哈希不变、根目录只多出规范目录与 AGENTS.md"
    - "进项目 git：git add -A && git ls-files -s fluid-design-spec 的 mode 列全为 100644，文件数与规范目录一致（17）"
    - "幂等：第二次跑打印「.git 已不存在，跳过」「已有规范约束块，跳过」，AGENTS.md 的 sha256 不变、标记数 = 1"
    - "已有 AGENTS.md（末尾无换行）：head -c <原大小> AGENTS.md | cmp - 原件 → 前缀逐字节相同"
    - "GBK 的 AGENTS.md：追加后同样 cmp 通过（原字节零损坏），并打印「不是 UTF-8」提示"
    - "只有 CLAUDE.md：约束块写进 CLAUDE.md，不新建 AGENTS.md"
    - "开关：--dry-run 全量哈希不变且不新建 AGENTS.md；--no-agents 删 .git 但不动 agent 文件；--keep-git 保留 .git 且实测索引为 160000（警告属实）"
    - "老位置 docs/fluid-design-spec：从项目根跑 → AGENTS.md 落在项目根，docs/ 下不生成，日志注明根目录来源是「当前目录」"
    - "判断不出项目根：在 <无 .git 的目录>/fluid-design-spec 里直接跑 → 退出码 1、不往上写 AGENTS.md；加 --root 后正常"
    - "从子目录 src/deep 跑：按规范目录位置解析出项目根，AGENTS.md 落在项目根"
    - "submodule 形式：.git 是文件 → 提示；索引 160000 → 打印恢复命令；照做（git rm -r -f --cached + git add）后全部 100644"
    - "先被 git add 成 gitlink：同样打印恢复命令，照做后 100644"
    - "AGENTS.md 是符号链接：退出码 0、项目外文件未被创建、打印跳过原因"
    - "--agents-md 越界（../escaped.md）：退出码 1、项目外未被写；--agents-md docs/RULES.md（父目录不存在）：自动创建父目录并写入"
    - "错误路径：非规范目录 → 退出码 1 且提示先 clone；未知参数 → 退出码 1 并打印用法；--help → 退出码 0；.gitignore 忽略规范目录 → 打印警告"
    - "门禁回归：安装后的目录跑 node fluid-design-spec/scripts/brand.mjs check → 9 pass / 0 fail / 3 warn，退出码 0"
  acceptance_criteria:
    - "AC1 正常（公开仓库）：在任意目录执行 git clone --depth 1 https://github.com/kaijia323/fluid-design-spec.git <dir>，无需任何登录/token/Collaborator 即成功，退出码 0。"
    - "AC2 正常（落位）：在项目根目录执行 git clone … fluid-design-spec 后，规范位于 <项目根>/fluid-design-spec/；安装后项目根目录只多出 fluid-design-spec/ 与 AGENTS.md，用户项目原有的 README.md 等文件内容逐字节不变。"
    - "AC3 正常（进项目 git）：node fluid-design-spec/scripts/install.mjs 退出码 0；执行后 fluid-design-spec/.git 不存在；项目里 git add -A 后 git ls-files -s fluid-design-spec 全部为 100644（不出现 160000），文件数与规范目录里的文件数一致。"
    - "AC4 正常（约束生效）：项目根 AGENTS.md 出现 <!-- fluid-design-spec:begin --> … <!-- fluid-design-spec:end --> 块，块内含移动端/Web 两端读取组合、--color-on-accent 规则、brand.mjs derive / check 命令。"
    - "AC5 边界（不破坏既有内容 / 幂等）：已有 AGENTS.md 的项目，用户原内容逐字节保留且块追加在其后；同一个项目重复跑第二次不再追加（标记出现次数 = 1）；只有 CLAUDE.md 没有 AGENTS.md 的项目，块写进 CLAUDE.md。"
    - "AC6 边界（开关）：--dry-run 后 fluid-design-spec/.git 仍存在且 AGENTS.md 未创建；--no-agents 不创建也不修改任何 agent 文件；--keep-git 保留 .git，并明确警告项目 git 会记成 160000 子模块指针。"
    - "AC7 失败（错误路径可解释）：在不是规范目录的地方执行 install.mjs → 退出码 1 且提示先 git clone；未知参数 → 退出码 1 并打印用法；--help → 退出码 0。"
    - "AC8 回归（规范本体不受影响）：安装后的目录执行 node fluid-design-spec/scripts/brand.mjs check → 9 pass / 0 fail / 3 warn、退出码 0；README 中不再存在「本仓库私有」「安装位置 docs/fluid-design-spec」「让读者使用 gh repo clone」的表述（仅允许「不要用 gh repo clone」这类反向说明）。"
    - "AC9 边界（非 UTF-8 不损坏）：AGENTS.md 是 GBK 等非 UTF-8 时，追加后原文件字节逐字节不变（head -c <原大小> | cmp 通过），并打印编码提示。"
    - "AC10 边界（不往不确定的位置写）：规范目录不在项目根、且项目根判断不出来时，install.mjs 退出码 1 且不在上层目录生成 AGENTS.md（--root 指定后正常）；AGENTS.md 是符号链接或 --agents-md 指到项目根外时拒绝写入（退出码 1 或跳过并说明），项目外文件不被创建。"
    - "AC11 失败（索引已是子模块指针）：索引里 fluid-design-spec/ 已是 mode 160000 时，install.mjs 打印可复制的恢复命令（含 -f）；照做后 git ls-files -s 全部变为 100644。"
  verification:
    result: "11/11 AC 通过；回归套件 16 组 52 项断言 52 PASS / 0 FAIL；文件以 100644 进项目 git；brand.mjs 门禁 9 pass / 0 fail / 3 warn"
